<!DOCTYPE html>
<html lang="en">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document Structure</title>
    <style>
        * {
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            margin: 20px;
            background-color: #f5f5f5;
        }

        header {
            background-color: #eee5ff;
            border: 4px solid #9b59d0;
            padding: 35px;
            text-align: center;
            border-radius: 20px;
            margin-bottom: 15px;
        }

        nav {
            background-color: #e0f0ff;
            border: 4px solid #55a5df;
            padding: 25px;
            text-align: center;
            border-radius: 20px;
            margin-bottom: 15px;
        }

        .container {
            display: grid;
            grid-template-columns: 2fr 1fr;
            gap: 15px;
            margin-bottom: 15px;
        }

        main {
            background-color: #e5f5f2;
            border: 4px solid #54b99b;
            padding: 25px;
            border-radius: 20px;
            margin-bottom: 15px;
            height: 650px;
        }


    article{
        background-color: #f5e9e3;
            border: 4px solid #e47750;
            padding: 30px;
            height: 260px;
            border-radius: 20px;
            margin-bottom: 15px;
    }

    section{
        background-color: #f5e9e3;
            border: 4px solid #e47750;
            padding: 30px;
            height: 260px;
            border-radius: 20px;
            margin-bottom: 15px;
    }

    aside{
        background-color: #d5e5f5;
            border: 4px solid #2cc3e6;
            padding: 30px;
            height: 650px;
            border-radius: 20px;
            margin-bottom: 20px;
    }

    footer{
         background-color: #e0f2ef;
            border: 4px solid #54a88f;
            padding: 30px;
            text-align: center;
            border-radius: 20px;
    }

 h2 {
            margin-top: 0;
        }

    </style>
</head>

<body>

    <header>
        <h2>&lt;header&gt;</h2>
    </header>

    <nav>
        <h2>&lt;nav&gt;</h2>
    </nav>

    <div class="container">

        <main>
            <h2>&lt;main&gt;</h2>

            <article>
                <h2>&lt;article&gt;</h2>
            </article>

            <section>
                <h2>&lt;section&gt;</h2>
            </section>

        </main>

        <aside>
            <h2>&lt;aside&gt;</h2>
        </aside>

    </div>

    <footer>
        <h2>&lt;footer&gt;</h2>
    </footer>

</body>
</html>  
</style>
</html>
