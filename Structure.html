<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Web Design</title>
    <style>
        *{
            box-sizing: border-box;
        }
        html{
            background-color: #8be7ee;
        }
        body{
            width: min(820px, 100%);
            margin: 0 auto;
            min-height: 100vh;
            background-color: #f5f5f5;
            color: #fffefe;
            display: grid;
            grid-template-columns: minmax(0px, 2.05fr) minmax(0px, 1fr);
            align-items: stretch;
            gap: 16px;
            padding: 28px 20px 40px;

        }
        header,nav,footer{
            grid-column: 1 / -1;
        }
        header{
            background-color: #8247ee;
            border-color: #9b59d0;
            height: 92px;
            display: grid;
            place-items: center;
        }
        nav{
            background-color: #55a5df;
            border-color: #55a5df;
            height: 92px;
            display: grid;
            place-items: center;
        }
        main{
            background-color: #54b99b;
            border-color: #54b99b;
            height: 650px;
            display: grid;
            grid-template-rows: 1fr 1fr;
            gap: 16px;
            place-items: center;
        }
        aside{
            background-color: #50e4d3;
            color: #fff;
            place-items: center;
            display: grid;
            padding: 16px;
        }
        article{
            background-color: #50cbe4;
            color: #fff;
            place-items: center;
            display: grid;
            padding: 20px;
            min-height: 180px;
        }
        section{
            background-color: #4065ba;
            color: #fff;
            place-items: center;
            display: grid;
            padding: 20px;
            min-height: 180px;
        }
        footer{
            background-color: #1c67e0;
            color: #fff;
            display: grid;
            place-items: center;
            height: 100px;
        }
        @media(max-width: 700px){
            body{
                grid-template-columns: 1fr;
            }
            header,
            nav,
            main,
            aside,
            footer{
                font-size: 12px;
            }
            aside{
                height: 180px;
            }
        }
    </style>
</head>
<body>
    <header>Header</header>
    <nav>Navigation</nav>
    <main>
        <article>Article</article>
        <section>Section</section>
    </main>
    <aside>Aside</aside>
    <footer>Footer</footer>
</body>

</html>
